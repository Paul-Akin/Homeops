# Gradle Daemon JVM criteria: Gradle and Android Studio run the build on a Java 21 JDK,
# whatever JAVA_HOME or the IDE default is. Gradle 8.14 cannot run on Java 25.
# To add automatic JDK download URLs, run on a machine with normal internet access:
#   ./gradlew updateDaemonJvm --jvm-version=21
toolchainVersion=21
